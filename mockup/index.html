<!DOCTYPE html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalorické tabuľky – náhľad</title>
<style>
:root {
  --bg: #0e1013; --card: #171a20; --card2: #1f232b; --line: #272c35;
  --text: #eef1f5; --muted: #8b93a1; --track: #272c35;
  --accent: #38bdf8; --onaccent: #04202e; --ok: #38bdf8; --warn: #fbbf24; --bad: #f87171;
  --mp: #f472b6; --mc: #fb923c; --mf: #a78bfa;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
[data-theme="light"] {
  --bg: #f3f5f8; --card: #ffffff; --card2: #eef1f5; --line: #e2e6ed;
  --text: #14171c; --muted: #667080; --track: #e5e8ee; --accent: #0284c7; --onaccent: #ffffff; --ok: #0284c7; --warn: #d97706; --bad: #dc2626;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #07080a; color: var(--text);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
[data-theme="light"] body { background: #dfe3ea; }
[data-pal="violet"] { --accent: #a78bfa; --ok: #a78bfa; --onaccent: #1b0f40; }
[data-pal="cyan"] { --accent: #22d3ee; --ok: #22d3ee; --onaccent: #052a33; }
[data-theme="light"][data-pal="violet"] { --accent: #7c3aed; --ok: #7c3aed; --onaccent: #ffffff; }
[data-theme="light"][data-pal="cyan"] { --accent: #0891b2; --ok: #0891b2; --onaccent: #ffffff; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; color: var(--text); }
svg { display: block; }

#app { position: relative; height: 100dvh; max-width: 430px; margin: 0 auto; background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden; overflow: clip; }
@media (min-width: 520px) { #app { height: min(100dvh - 32px, 900px); margin-top: 16px; border-radius: 34px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5); border: 1px solid var(--line); } }

header { padding: calc(var(--sat) + 14px) 20px 6px; display: flex; align-items: flex-start; justify-content: space-between; }
header h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
header .sub { color: var(--muted); font-size: 14px; margin-top: 1px; }
.gear { width: 42px; height: 42px; border-radius: 14px; background: var(--card); display: grid; place-items: center; color: var(--muted); }

#view { flex: 1; overflow-y: auto; padding: 8px 16px 170px; scrollbar-width: none; }
#view::-webkit-scrollbar { display: none; }

nav { display: flex; padding: 8px 12px calc(var(--sab) + 10px); background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 600; }
nav button.on { color: var(--accent); }
.fab { position: absolute; right: 18px; bottom: calc(var(--sab) + 84px); height: 56px; padding: 0 22px 0 16px; border-radius: 28px;
  background: var(--accent); color: var(--onaccent); display: flex; align-items: center; gap: 8px; font-weight: 700;
  box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 35%, transparent); z-index: 5; }
.fab:active { transform: scale(.97); }

.days { display: flex; gap: 6px; margin: 4px 0 14px; }
.day { flex: 1; padding: 8px 0 7px; border-radius: 14px; background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.day b { font-size: 16px; color: var(--text); }
.day i { width: 6px; height: 6px; border-radius: 50%; background: var(--track); }
.day.on { background: var(--accent); color: var(--onaccent); }
.day.on b { color: var(--onaccent); }
.day.on i { background: var(--onaccent) !important; }

.card { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
.hero { display: flex; flex-direction: column; align-items: center; }
.ring { position: relative; width: 100%; }
.ring svg { width: 100%; height: auto; }
.trk { fill: none; stroke: var(--track); stroke-width: 11; }
.arc { fill: none; stroke-width: 11; stroke-linecap: round;
  transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1), stroke .4s, opacity .3s; }
.rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.rc b { font-size: 22px; letter-spacing: -.02em; line-height: 1.05; }
.rc span { font-size: 11px; color: var(--muted); margin-top: 2px; }
.hero .ring { width: 230px; }
.hero .rc b { font-size: 46px; }
.hero .rc span { font-size: 14px; }
.hero-sub { color: var(--muted); font-size: 14px; margin-top: 10px; }
.hero-sub b { color: var(--text); }

.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; width: 100%; }
.mini { text-align: center; }
.mini .ring { width: 100%; max-width: 104px; margin: 0 auto; }
.mini .rc b { font-size: 19px; }
.mini .rc span { font-size: 10px; }
.mini .nm { margin-top: 6px; font-size: 13px; font-weight: 600; }
.more { margin: 14px auto 0; color: var(--muted); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 6px 8px; font-weight: 700; display: flex; justify-content: space-between; }
.meal { background: var(--card); border-radius: 20px; padding: 6px 6px; margin-bottom: 10px; }
.mhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 4px; font-weight: 700; }
.mhead span { color: var(--muted); font-weight: 600; font-size: 14px; }
.entry { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; border-radius: 14px; text-align: left; }
.entry:active, .frow:active { background: var(--card2); }
.entry .n { font-weight: 600; }
.entry .g { color: var(--muted); font-size: 13px; }
.entry .k { font-weight: 700; }
.entry .k small { color: var(--muted); font-weight: 500; }
.empty { display: block; width: 100%; padding: 12px; color: var(--muted); font-size: 14px; text-align: left; border-radius: 14px; }
.empty u { text-decoration: none; color: var(--accent); font-weight: 600; }

.search { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 16px; padding: 0 14px; color: var(--muted); margin-bottom: 10px; }
.search input { flex: 1; background: none; border: 0; outline: none; padding: 14px 0; font-size: 16px; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 20px; background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600; }
.chip.on { background: var(--accent); color: var(--onaccent); }
.sortbar { display: flex; align-items: center; gap: 6px; margin: 2px 4px 8px; color: var(--muted); font-size: 13px; }
.sortbar button { padding: 5px 10px; border-radius: 10px; font-weight: 600; }
.sortbar button.on { background: var(--card); color: var(--text); }
.frow { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; text-align: left; background: var(--card); margin-bottom: 8px; }
.frow .fn { font-weight: 600; }
.frow .fm { font-size: 12px; color: var(--muted); margin-top: 2px; }
.frow .fm i { font-style: normal; font-weight: 700; }
.mix { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 7px; width: 120px; gap: 1px; }
.mix i { display: block; height: 100%; }
.fk { text-align: right; flex: none; }
.fk b { font-size: 20px; letter-spacing: -.02em; }
.fk span { display: block; font-size: 11px; color: var(--muted); }
.cnt { color: var(--muted); text-align: center; font-size: 13px; padding: 14px; }

.seg { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; padding: 9px 0; border-radius: 11px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card2); color: var(--text); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border-radius: 20px; padding: 14px 16px; }
.stat .l { color: var(--muted); font-size: 13px; }
.stat .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
.stat .v small { font-size: 14px; font-weight: 600; color: var(--muted); }
.chart { width: 100%; height: auto; }
.legend { display: flex; gap: 14px; justify-content: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.btn { background: var(--accent); color: var(--onaccent); font-weight: 700; border-radius: 16px; padding: 15px 18px; width: 100%; font-size: 16px; }
.btn.sec { background: var(--card2); color: var(--text); }
.btn.dng { background: transparent; color: var(--bad); }
.btn:disabled { opacity: .5; }
.btn.sm { width: auto; padding: 9px 14px; font-size: 14px; border-radius: 12px; }

#sheetwrap { position: absolute; inset: 0; z-index: 20; visibility: hidden; overflow: clip; }
#sheetwrap.vis { visibility: visible; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--bg);
  border-radius: 26px 26px 0 0; padding: 10px 18px calc(var(--sab) + 22px); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); border-top: 1px solid var(--line); }
#sheetwrap.open .backdrop { opacity: 1; }
#sheetwrap.open .sheet { transform: translateY(0); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.02em; }
.sheet h4 { margin: 16px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.sheet .tag { display: inline-block; font-size: 11px; color: var(--muted); background: var(--card); padding: 3px 8px; border-radius: 8px; margin-bottom: 10px; }
.recent { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.rcard { flex: none; width: 128px; background: var(--card); border-radius: 16px; padding: 12px; text-align: left; }
.rcard b { display: block; font-size: 14px; }
.rcard span { color: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.tile { background: var(--card); border-radius: 18px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px; font-weight: 700; }
.tile svg { color: var(--accent); }
.tile small { color: var(--muted); font-weight: 500; font-size: 12px; margin-top: -6px; }
.big { font-size: 44px; font-weight: 800; letter-spacing: -.03em; }
.big small { font-size: 16px; color: var(--muted); font-weight: 600; }
.macros { display: flex; gap: 18px; margin: 2px 0 10px; font-size: 15px; }
.macros b { font-weight: 700; }
.after { padding: 10px 14px; background: var(--card); border-radius: 14px; font-size: 14px; margin-bottom: 14px; }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 16px; padding: 6px; margin-bottom: 14px; }
.stepper button { width: 46px; height: 46px; border-radius: 12px; background: var(--card2); font-size: 22px; font-weight: 600; }
.stepper div { font-weight: 700; font-size: 18px; text-align: center; }
.stepper div small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.stepper input { width: 90px; text-align: center; background: none; border: 0; outline: none; font-size: 22px; font-weight: 700; }
.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.field input { display: block; width: 100%; margin-top: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; outline: none; }
.field input:focus { border-color: var(--accent); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.drop { display: grid; place-items: center; gap: 8px; text-align: center; border: 2px dashed var(--line); border-radius: 20px; padding: 34px 16px; color: var(--muted); cursor: pointer; }
.drop svg { color: var(--accent); }
.prev { width: 100%; max-height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 12px; }
.scan { position: relative; height: 200px; border-radius: 20px; background: #000; overflow: hidden; display: grid; place-items: center; color: #9aa; margin-bottom: 14px; }
.scan::before { content: ""; position: absolute; left: 12%; right: 12%; height: 2px; background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: sc 1.8s ease-in-out infinite alternate; }
@keyframes sc { from { top: 28%; } to { top: 72%; } }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp .8s linear infinite; margin: 18px auto; }
@keyframes sp { to { transform: rotate(360deg); } }
.airow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.airow .i { flex: 1; min-width: 0; } .airow .i b { display: block; font-size: 15px; } .airow .i span { color: var(--muted); font-size: 12px; }
.airow input { width: 72px; text-align: center; background: var(--card2); border: 0; border-radius: 10px; padding: 10px 6px; font-weight: 700; outline: none; }
.note { color: var(--muted); font-size: 12px; margin: 10px 2px 0; }

#toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--sab) + 152px); z-index: 30; background: var(--text); color: var(--bg);
  padding: 12px 14px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
  opacity: 0; transform: translateY(12px); pointer-events: none; transition: .25s; }
#toast.show { opacity: 1; transform: none; pointer-events: auto; }
#toast button { color: var(--accent); font-weight: 800; }
</style>
</head>
<body>
<div id="app">
  <header id="head"></header>
  <main id="view"></main>
  <button class="fab" data-act="add">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Pridať
  </button>
  <nav id="nav"></nav>
  <div id="toast"></div>
  <div id="sheetwrap"><div class="backdrop" data-act="close"></div><div class="sheet"><div class="grab"></div><div id="sheetbody"></div></div></div>
</div>

<script>
"use strict";

/* ====== UKÁŽKOVÉ ÚDAJE (nie overené, len na ukážku vzhľadu) ====== */
const F = (id, name, cat, k, p, c, f, fib, sug, salt, portions) => ({ id, name, cat, k, p, c, f, fib, sug, salt, portions, fav: false });
const FOODS = [
  F("ov", "Ovsené vločky", "Pečivo a obilniny", 372, 13.5, 58.7, 7, 10, 1.1, 0.02, [["1 misa", 60], ["1 lyžica", 10]]),
  F("ry", "Ryža varená", "Pečivo a obilniny", 130, 2.7, 28, 0.3, 0.4, 0.1, 0.01, [["1 porcia", 180]]),
  F("ce", "Cestoviny varené", "Pečivo a obilniny", 158, 5.8, 30.9, 0.9, 1.8, 0.6, 0.01, [["1 porcia", 200]]),
  F("ch", "Chlieb pšenično-ražný", "Pečivo a obilniny", 245, 8, 47, 1.8, 3.5, 3, 1.2, [["1 krajec", 40]]),
  F("kp", "Kuracie prsia", "Mäso a ryby", 110, 23, 0, 1.5, 0, 0, 0.15, [["1 filet", 150]]),
  F("lo", "Lososový filet", "Mäso a ryby", 208, 20, 0, 13, 0, 0, 0.1, [["1 filet", 140]]),
  F("sa", "Šunka", "Mäso a ryby", 110, 18, 1, 4, 0, 1, 2, [["1 plátok", 20]]),
  F("mi", "Mlieko polotučné", "Mliečne a vajcia", 47, 3.4, 4.8, 1.5, 0, 4.8, 0.1, [["1 pohár", 250]]),
  F("jo", "Jogurt biely", "Mliečne a vajcia", 61, 3.5, 4.7, 3.3, 0, 4.7, 0.1, [["1 pohár", 150]]),
  F("tv", "Tvaroh polotučný", "Mliečne a vajcia", 98, 12, 3.5, 4, 0, 3.5, 0.1, [["1 balenie", 250]]),
  F("va", "Vajce", "Mliečne a vajcia", 143, 12.6, 0.7, 9.5, 0, 0.4, 0.36, [["1 ks", 60]]),
  F("ba", "Banán", "Ovocie", 89, 1.1, 22.8, 0.3, 2.6, 12.2, 0.01, [["1 ks", 120]]),
  F("ja", "Jablko", "Ovocie", 52, 0.3, 13.8, 0.2, 2.4, 10.4, 0, [["1 ks", 180]]),
  F("zv", "Zemiaky varené", "Zelenina a prílohy", 86, 1.7, 20, 0.1, 1.8, 0.8, 0.01, [["1 ks", 100]]),
  F("br", "Brokolica varená", "Zelenina a prílohy", 35, 2.4, 7, 0.4, 3.3, 1.4, 0.03, [["1 porcia", 150]]),
  F("pa", "Paradajka", "Zelenina a prílohy", 18, 0.9, 3.9, 0.2, 1.2, 2.6, 0.01, [["1 ks", 120]]),
  F("ma", "Mandle", "Ostatné", 579, 21, 22, 50, 12.5, 4.4, 0.01, [["1 hrsť", 30]]),
  F("ol", "Olivový olej", "Ostatné", 884, 0, 0, 100, 0, 0, 0, [["1 lyžica", 14]]),
  F("co", "Čokoláda horká", "Ostatné", 550, 7, 46, 36, 11, 30, 0.02, [["1 kocka", 10]]),
];
const byId = (id) => FOODS.find((x) => x.id === id);
const GOALS = { kcal: 2200, p: 140, c: 250, f: 70, fib: 30, sug: 55, salt: 5 };
const MEALS = ["Raňajky", "Obed", "Večera", "Desiate"];
const WD = ["Nedeľa", "Pondelok", "Utorok", "Streda", "Štvrtok", "Piatok", "Sobota"];
const WDS = ["Ne", "Po", "Ut", "St", "Št", "Pi", "So"];
const MON = ["januára", "februára", "marca", "apríla", "mája", "júna", "júla", "augusta", "septembra", "októbra", "novembra", "decembra"];

const today = new Date(); today.setHours(0, 0, 0, 0);
const DAYS = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() - (6 - i)); return d; });
let uid = 1;
const logs = DAYS.map(() => []);
const entry = (meal, id, g) => ({ id: uid++, meal, fid: id, g });
const PATTERN = [["Raňajky", "ov", 70], ["Raňajky", "mi", 250], ["Obed", "kp", 180], ["Obed", "ry", 200], ["Obed", "ol", 10],
  ["Večera", "ch", 80], ["Večera", "sa", 60], ["Večera", "va", 120], ["Desiate", "ba", 120], ["Desiate", "ma", 30]];
[1.25, 1.4, 1.15, 1.3, 1.5, 1.2].forEach((k, i) => PATTERN.forEach(([m, id, g]) => logs[i].push(entry(m, id, Math.round((g * k) / 5) * 5))));
[["Raňajky", "ov", 60], ["Raňajky", "mi", 200], ["Raňajky", "ba", 120], ["Obed", "kp", 150], ["Obed", "ry", 180]]
  .forEach(([m, id, g]) => logs[6].push(entry(m, id, g)));

let weights = [83.1, 83.0, 82.8, 82.9, 82.6, 82.5, 82.4, 82.2, 82.3, 82.0, 81.9, 81.9, 81.7, 81.6];

/* ====== POMOCNÉ ====== */
const $ = (s, r = document) => r.querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString("sk-SK");
const fmt1 = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nutr = (e) => { const f = byId(e.fid), k = e.g / 100; return { k: f.k * k, p: f.p * k, c: f.c * k, f: f.f * k, fib: f.fib * k, sug: f.sug * k, salt: f.salt * k }; };
const totals = (log) => log.reduce((t, e) => { const n = nutr(e); for (const key in n) t[key] += n[key]; return t; }, { k: 0, p: 0, c: 0, f: 0, fib: 0, sug: 0, salt: 0 });

const YEL = "var(--warn)", GRN = "var(--ok)", RED = "var(--bad)";
function state(value, target, dir) {
  const r = target ? value / target : 0;
  if (dir === "max") return { r, color: r > 1.1 ? RED : r > 0.8 ? YEL : GRN };
  return { r, color: r > 1.1 ? RED : r >= 0.9 ? GRN : YEL };
}

const ui = { tab: "today", day: 6, more: false, q: "", cat: "Všetko", sort: "name", span: "week",
  meal: new Date().getHours() < 10 ? "Raňajky" : new Date().getHours() < 14 ? "Obed" : new Date().getHours() < 17 ? "Desiate" : "Večera", theme: "dark", pal: "blue" };
const ringPrev = {}, ringNext = {};

/* ====== PRSTENEC (plní sa animovane od predošlej hodnoty) ====== */
function ring(key, val, target, dir, center) {
  const st = state(val, target, dir), pct = Math.min(st.r, 1), C = 2 * Math.PI * 52;
  ringNext[key] = pct;
  const prev = ringPrev[key] || 0;
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/>
    <circle class="arc" data-key="${key}" data-c="${C}" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - prev)}" style="stroke:${st.color};opacity:${prev > 0 ? 1 : 0}"/></svg>
    <div class="rc">${center}</div></div>`;
}
function animateRings() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".arc").forEach((a) => {
      const k = a.dataset.key, C = +a.dataset.c;
      a.style.strokeDashoffset = C * (1 - ringNext[k]);
      a.style.opacity = ringNext[k] > 0 ? 1 : 0;
      ringPrev[k] = ringNext[k];
    });
  }));
}

    <div class="mix"><i style="flex:${f.p * 4 / tot};background:var(--mp)"></i><i style="flex:${f.c * 4 / tot};background:var(--mc)"></i><i style="flex:${f.f * 9 / tot};background:var(--mf)"></i></div></div>
    <div class="fk"><b>${fmt(f.k)}</b><span>kcal / 100 g</span></div></button>`;
}
function foodList() {

/* ====== POKROK ====== */
function barChart(vals, labels, highlightLast) {
  const W = 360, H = 190, L = 34, B = 24, T = 10, pw = W - L - 6, ph = H - B - T;
  const max = Math.max(...vals, GOALS.kcal) * 1.1, y = (v) => T + ph - (v / max) * ph, bw = pw / vals.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= 3; i++) { const v = (max / 3) * i; s += `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`; }
  vals.forEach((v, i) => {
    const h = (v / max) * ph, x = L + bw * i + bw * 0.2;
    s += `<rect x="${x}" y="${T + ph - h}" width="${bw * 0.6}" height="${Math.max(h, 2)}" rx="${Math.min(6, bw * 0.3)}" style="fill:${v ? state(v, GOALS.kcal, "min").color : "var(--track)"}" opacity="${highlightLast && i !== vals.length - 1 ? 0.55 : 1}"/>`;
    if (labels[i]) s += `<text x="${L + bw * i + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[i]}</text>`;
  });
  s += `<line x1="${L}" x2="${W - 6}" y1="${y(GOALS.kcal)}" y2="${y(GOALS.kcal)}" stroke="var(--text)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/>`;
  return s + "</svg>";
}
function weightChart() {
  const W = 360, H = 120, L = 6, R = 6, T = 10, B = 10, lo = Math.min(...weights) - 0.4, hi = Math.max(...weights) + 0.4;
  const x = (i) => L + (i / (weights.length - 1)) * (W - L - R), y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const pts = weights.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>
    <circle cx="${x(weights.length - 1)}" cy="${y(weights[weights.length - 1])}" r="4.5" fill="var(--accent)"/></svg>`;
}
function renderProgress() {
  const week = ui.span === "week";
  let vals, labels;
  if (week) { vals = logs.map((l) => totals(l).k); labels = DAYS.map((d) => WDS[d.getDay()]); }
  else { vals = Array.from({ length: 30 }, (_, i) => i >= 23 ? totals(logs[i - 23]).k : Math.round(1750 + 380 * Math.sin(i * 1.7) + 140 * Math.cos(i * 0.9))); labels = vals.map((_, i) => (i % 5 === 0 ? i + 1 : "")); }
  const logged = vals.filter((v) => v > 0), avg = logged.reduce((a, b) => a + b, 0) / (logged.length || 1);
  const inGoal = vals.filter((v) => v >= GOALS.kcal * 0.9 && v <= GOALS.kcal * 1.1).length;
  const avgP = logs.reduce((a, l) => a + totals(l).p, 0) / logs.filter((l) => l.length).length;
  const change = weights[weights.length - 1] - weights[0];
  $("#view").innerHTML = `<div class="seg"><button data-span="week" class="${week ? "on" : ""}">Týždeň</button><button data-span="month" class="${week ? "" : "on"}">Mesiac</button></div>
    <div class="card">${barChart(vals, labels, false)}<div class="legend"><span><i style="background:${YEL}"></i>pod cieľom</span><span><i style="background:${GRN}"></i>v cieli</span><span><i style="background:${RED}"></i>nad cieľom</span></div></div>
    <div class="stats">
      <div class="stat"><div class="l">Priemer / deň</div><div class="v">${fmt(avg)} <small>kcal</small></div></div>
      <div class="stat"><div class="l">Dní v cieli</div><div class="v">${inGoal} <small>z ${vals.length}</small></div></div>
      <div class="stat"><div class="l">Bielkoviny / deň</div><div class="v">${fmt(avgP)} <small>g</small></div></div>
      <div class="stat"><div class="l">Zmena váhy</div><div class="v" style="color:${change <= 0 ? GRN : YEL}">${change > 0 ? "+" : ""}${fmt1(change)} <small>kg</small></div></div></div>
    <h2><span>Váha</span><span style="text-transform:none;letter-spacing:0">${fmt1(weights[weights.length - 1])} kg</span></h2>
    <div class="card">${weightChart()}<button class="btn sec" style="margin-top:12px" data-act="weight">Zapísať váhu</button></div>
    <div class="note" style="text-align:center">Ukážkové údaje</div>`;
}

    <label class="field">Názov<input id="o-n" placeholder="Napr. Domáca omáčka"></label>
    <div class="grid4"><label class="field">kcal<input id="o-k" inputmode="decimal"></label><label class="field">Bielk.<input id="o-p" inputmode="decimal"></label>
      <label class="field">Sach.<input id="o-c" inputmode="decimal"></label><label class="field">Tuky<input id="o-f" inputmode="decimal"></label></div>
    <button class="btn" data-act="own-save">Uložiť a pokračovať</button>`);
}

function openSettings() {
  openSheet(`<h3>Nastavenia</h3>
    <h4>Vzhľad</h4><div class="seg">${[["dark", "Tmavá"], ["light", "Svetlá"], ["auto", "Podľa systému"]].map(([k, l]) => `<button data-th="${k}" class="${ui.theme === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <h4>Farba</h4><div class="seg">${[["blue", "Modrá"], ["violet", "Fialová"], ["cyan", "Azúrová"]].map(([k, l]) => `<button data-setpal="${k}" class="${ui.pal === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <h4>Denný cieľ</h4><div class="stepper"><button data-goal="-50">−</button><div id="goalv">${fmt(GOALS.kcal)}<small>kcal</small></div><button data-goal="50">+</button></div>
    <h4>Gemini API kľúč</h4><label class="field"><input type="password" placeholder="Vlož kľúč z Google AI Studio" autocomplete="off"></label>
    <div class="note">V plnej verzii tu bude aj profil a výpočet príjmu, záloha dát, hodinky a čiarový kód.</div>`);
}

function openWeight() {
  openSheet(`<h3>Zapísať váhu</h3><label class="field">Dnes (kg)<input id="wv" inputmode="decimal" value="${fmt1(weights[weights.length - 1])}"></label><button class="btn" data-act="w-save">Uložiť</button>`);
}

function applyTheme() {
  const dark = ui.theme === "dark" || (ui.theme === "auto" && !matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pal = ui.pal;
}

/* ====== UDALOSTI ====== */
document.addEventListener("click", (ev) => {
  const t = ev.target, d = (sel) => t.closest(sel);
  let el;
  if ((el = d("[data-tab]"))) { ui.tab = el.dataset.tab; render(); $("#view").scrollTop = 0; return; }
  if ((el = d("[data-day]"))) { ui.day = +el.dataset.day; render(); return; }
  if ((el = d("[data-cat]"))) { ui.cat = el.dataset.cat; renderFoods(); return; }
  if ((el = d("[data-sort]"))) { ui.sort = el.dataset.sort; renderFoods(); return; }
  if ((el = d("[data-span]"))) { ui.span = el.dataset.span; render(); return; }
  if ((el = d("[data-food]"))) { openFood(el.dataset.food); return; }
  if ((el = d("[data-edit]"))) { openEdit(+el.dataset.edit); return; }
  if ((el = d("[data-add-meal]"))) { ui.meal = el.dataset.addMeal; openAdd(); return; }
  if ((el = d("[data-meal]"))) { ui.meal = el.dataset.meal; document.querySelectorAll("[data-meal]").forEach((b) => b.classList.toggle("on", b.dataset.meal === ui.meal)); const c = $("#sheetbody .btn[data-confirm]"); return; }
  if ((el = d("[data-quick]"))) {
    const f = byId(el.dataset.quick), e = addEntry(f.id, f.portions[0][1]);
    closeSheet(); render(); toast(`Pridané: ${f.name}`, () => { logs[ui.day] = logs[ui.day].filter((x) => x.id !== e.id); render(); }); return;
  }
  if ((el = d("[data-p]"))) { const c = openFood.ctx; c.s.mode = el.dataset.p === "g" ? "g" : +el.dataset.p; c.s.qty = 1; $("#pchips").innerHTML = c.f.portions.map((p, i) => `<button class="chip ${c.s.mode === i ? "on" : ""}" data-p="${i}">${p[0]} (${p[1]} g)</button>`).join("") + `<button class="chip ${c.s.mode === "g" ? "on" : ""}" data-p="g">Gramy</button>`; c.upd(); return; }
  if ((el = d("[data-step]"))) { const c = openFood.ctx, dir = +el.dataset.step; if (c.s.mode === "g") c.s.grams = Math.max(10, c.s.grams + dir * 10); else c.s.qty = Math.max(0.5, c.s.qty + dir * 0.5); c.upd(); return; }
  if ((el = d("[data-estep]"))) { const c = openEdit.ctx; c.e.g = Math.max(5, c.e.g + +el.dataset.estep); c.upd(); return; }
  if ((el = d("[data-fav]"))) { const f = byId(el.dataset.fav); f.fav = !f.fav; el.outerHTML = `<button class="chip" data-fav="${f.id}" style="float:right;${f.fav ? "background:var(--warn);color:#1b1b1b" : ""}">${f.fav ? "★ Obľúbené" : "☆ Obľúbené"}</button>`; return; }
  if ((el = d("[data-confirm]"))) {
    const c = openFood.ctx, g = c.grams(); if (!(g > 0)) { toast("Zadaj množstvo"); return; }
    const e = addEntry(c.f.id, g); closeSheet(); ui.tab = ui.tab === "foods" ? "foods" : ui.tab; render();
    toast(`Pridané: ${c.f.name} (${fmt(g)} g)`, () => { logs[ui.day] = logs[ui.day].filter((x) => x.id !== e.id); render(); }); return;
  }
  if ((el = d("[data-th]"))) { ui.theme = el.dataset.th; applyTheme(); document.querySelectorAll("[data-th]").forEach((b) => b.classList.toggle("on", b.dataset.th === ui.theme)); return; }
  if ((el = d("[data-setpal]"))) { ui.pal = el.dataset.setpal; applyTheme(); document.querySelectorAll("[data-setpal]").forEach((b) => b.classList.toggle("on", b.dataset.setpal === ui.pal)); render(); return; }
  if ((el = d("[data-goal]"))) { GOALS.kcal = Math.max(1200, GOALS.kcal + +el.dataset.goal); $("#goalv").innerHTML = `${fmt(GOALS.kcal)}<small>kcal</small>`; render(); return; }

  const act = (d("[data-act]") || {}).dataset?.act;
  if (!act) return;
  const A = {
    close: closeSheet, add: openAdd, settings: openSettings, weight: openWeight,
    more: () => { ui.more = !ui.more; render(); },
    undo: () => { if (toast.undo) toast.undo(); $("#toast").classList.remove("show"); },
    "t-search": () => { closeSheet(); ui.tab = "foods"; render(); setTimeout(() => $("#q") && $("#q").focus(), 350); },
    "t-photo": openPhoto, "t-bar": openBarcode, "t-own": openOwn,
    "bar-sim": () => { closeSheet(); setTimeout(() => openFood("jo"), 320); },
    "ai-all": () => {
      let n = 0; openPhoto.items.forEach((it) => { if (it.g > 0) { addEntry(it.id, it.g); n++; } });
      closeSheet(); render(); toast(`Pridané položky: ${n}`);
    },
    "e-save": () => { closeSheet(); render(); },
    "e-dup": () => { const e = openEdit.ctx.e; logs[ui.day].push({ ...e, id: uid++ }); closeSheet(); render(); toast("Duplikované"); },
    "e-del": () => { const e = openEdit.ctx.e; logs[ui.day] = logs[ui.day].filter((x) => x.id !== e.id); closeSheet(); render(); toast("Zmazané", () => { logs[ui.day].push(e); render(); }); },
    "own-save": () => {
      const n = $("#o-n").value.trim(), num = (id) => parseFloat($(id).value.replace(",", ".")) || 0, k = num("#o-k");
      if (!n || !k) { toast("Vyplň názov a kcal"); return; }
      const f = F("u" + uid++, n, "Ostatné", k, num("#o-p"), num("#o-c"), num("#o-f"), 0, 0, 0, [["1 porcia", 100]]);
      FOODS.push(f); closeSheet(); setTimeout(() => openFood(f.id), 320);
    },
    "w-save": () => { const v = parseFloat($("#wv").value.replace(",", ".")); if (!(v >= 30 && v <= 300)) { toast("Neplatná váha"); return; }
      weights.push(v); weights = weights.slice(-14); closeSheet(); render(); toast("Váha zapísaná"); },
  };
  if (A[act]) A[act]();
});

document.addEventListener("input", (ev) => {
  if (ev.target.id === "q") { ui.q = ev.target.value; $("#flist").innerHTML = foodList(); }
  if (ev.target.dataset && ev.target.dataset.ai !== undefined) {
    const i = +ev.target.dataset.ai, g = Math.max(0, parseFloat(ev.target.value.replace(",", ".")) || 0);
    openPhoto.items[i].g = g; $("#ak" + i).textContent = `${fmt(byId(openPhoto.items[i].id).k * g / 100)} kcal`;
  }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeSheet(); });

applyTheme();
render();
</script>
</body>
</html>
